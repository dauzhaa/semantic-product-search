<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Search</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #e2e0db;
      --accent: #2f5d50;
      --accent-hover: #244a40;
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161617;
        --card: #1f1f21;
        --text: #f2f2f2;
        --muted: #9a9a9f;
        --border: #333336;
        --accent: #6fb39d;
        --accent-hover: #86c4af;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .note {
      margin: 0 0 28px;
      font-size: 0.875rem;
      color: var(--muted);
    }

    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      margin: 0;
    }

    .checkbox label {
      font-weight: 400;
    }

    button {
      font: inherit;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      cursor: pointer;
      justify-self: start;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }

    #results {
      margin-top: 28px;
    }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
      button { justify-self: stretch; }
    }
    #results { display: grid; gap: 12px; }

    .product {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    }

    .product h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
    .product p { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }

    .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    font-size: 0.875rem;
    color: var(--muted);
    }

    .price { color: var(--text); font-weight: 600; }
    .stock.in { color: var(--accent); }
    .stock.out { color: #b4483c; }

    .empty { color: var(--muted); text-align: center; padding: 24px 0; }

    button:disabled { opacity: 0.6; cursor: default; }
    button:disabled:hover { background: var(--accent); }

    .error { color: #b4483c; text-align: center; padding: 24px 0; }

    .hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Product Search</h1>
    <p class="note">Demo catalog: prices and stock are synthetic.</p>

    <form id="search-form">
      <div class="field">
        <label for="query">Search</label>
        <input type="text" id="query" name="query" placeholder="e.g. music while taking a shower">
      </div>

      <div class="row">
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">All categories</option>
            <option value="headphones">Headphones</option>
            <option value="speakers">Speakers</option>
            <option value="earbuds">Earbuds</option>
            <option value="microphones">Microphones</option>
          </select>
        </div>

        <div class="field">
          <label for="max-price">Max price (KZT)</label>
          <input type="number" id="max-price" name="max_price" min="0" placeholder="No limit">
        </div>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="in-stock" name="in_stock">
        <label for="in-stock">In stock only</label>
      </div>

      <p class="hint">
        Results are ranked by similarity and may not satisfy every feature you
        request. Use the category, price, and stock controls to apply those limits,
        and check each product’s description.
      </p>

      <button type="submit" id="search-button">Search</button>
    </form>

    <div id="results" aria-live="polite"></div>
  </main>
  <script>
  function renderProducts(products) {
  const results = document.getElementById("results");
  results.replaceChildren(); // clears previous results

  if (products.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No products match the selected filters. Try changing or clearing a filter.";
    results.append(empty);
    return;
  }

  for (const product of products) {
    const card = document.createElement("article");
    card.className = "product";

    const name = document.createElement("h2");
    name.textContent = product.name;

    const description = document.createElement("p");
    description.textContent = product.description;

    const meta = document.createElement("div");
    meta.className = "meta";

    const category = document.createElement("span");
    category.textContent = product.category;

    const price = document.createElement("span");
    price.className = "price";
    price.textContent = `${product.price.toLocaleString("ru-RU")} ${product.currency}`;

    const stock = document.createElement("span");
    stock.className = product.in_stock ? "stock in" : "stock out";
    stock.textContent = product.in_stock ? "In stock" : "Out of stock";

    meta.append(category, price, stock);
    card.append(name, description, meta);
    results.append(card);
  }
  }
  const form = document.getElementById("search-form");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const query = document.getElementById("query").value.trim();
    const category = document.getElementById("category").value;
    const maxPrice = document.getElementById("max-price").value;
    const inStock = document.getElementById("in-stock").checked;

    const payload = {
      query: query,
      category: category === "" ? null : category,
      max_price: maxPrice === "" ? null : Number(maxPrice),
      in_stock: inStock ? true : null
    };

    const button = document.getElementById("search-button");
    const results = document.getElementById("results");

    button.disabled = true;
    button.textContent = "Searching…";

    try {
      const response = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`Search failed: HTTP ${response.status}`);
      }

      const products = await response.json();
      renderProducts(products);
    } catch (error) {
      console.error("Could not complete search:", error);
      const message = document.createElement("p");
      message.className = "error";
      message.textContent = "Something went wrong. Please try again.";
      results.replaceChildren(message);
    } finally {
      button.disabled = false;
      button.textContent = "Search";
    }
  });
  </script>
</body>
</html>
